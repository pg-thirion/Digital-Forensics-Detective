name: Cross-browser regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test.mjs
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node browser-test.mjs
